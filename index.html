<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Habesha Bingo</title>
<style>
body{background:#101827;color:white;font-family:Arial;text-align:center;padding:15px}
h1{color:#ffd54a}
button{padding:12px;margin:4px;border:0;border-radius:7px}
#grid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.num{background:#eee;color:#111}
.selected{background:#31d18b}
.card{background:#1d2b40;padding:12px;margin:10px auto;border-radius:12px}
</style>
</head>
<body>
<h1>🎱 HABESHA BINGO</h1>

<div class="card">
<p>የተጫዋች ስም</p>
<input id="player" placeholder="ስምህን አስገባ">
<p>እያንዳንዱ ቁጥር 10 ብር</p>
<p id="count">የመረጥካቸው ቁጥሮች፦ 0</p>
<p id="cost">ጠቅላላ፦ 0 ብር</p>
</div>

<div class="card">
<h3>ከ1 እስከ 500 ቁጥሮች ምረጥ</h3>
<div id="grid"></div>
<button onclick="clearAll()">ምርጫዬን አጽዳ</button>
<button onclick="draw()">የሙከራ ዕጣ አውጣ</button>
</div>

<div class="card">
<h2 id="result">ዕድል መልካም! 🍀</h2>
<p id="message">የBingo ሙከራ ጨዋታ</p>
<p id="timer">ቆጣሪ፦ 4:00</p>
<p>የተጫዋቾች መረጃ እስካሁን ከሌሎች ጋር አይጋራም።</p>
</div>

<script>
const grid=document.getElementById("grid");
const selected=new Set();

for(let i=1;i<=500;i++){
 let b=document.createElement("button");
 b.className="num";
 b.textContent=i;
 b.onclick=()=>{
  if(selected.has(i)){
   selected.delete(i);
   b.classList.remove("selected");
  }else{
   if(selected.size>=10){
    alert("ከ10 ቁጥሮች በላይ መምረጥ አትችልም");
    return;
   }
   selected.add(i);
   b.classList.add("selected");
  }
  update();
 };
 grid.appendChild(b);
}

function update(){
 document.getElementById("count").textContent=
 "የመረጥካቸው ቁጥሮች፦ "+selected.size;
 document.getElementById("cost").textContent=
 "ጠቅላላ፦ "+selected.size*10+" ብር";
}

function clearAll(){
 selected.clear();
 document.querySelectorAll(".num").forEach(b=>b.classList.remove("selected"));
 update();
}

function draw(){
 const name=document.getElementById("player").value.trim();
 if(!name){alert("ስምህን አስገባ");return;}
 if(selected.size===0){alert("ቁጥር ምረጥ");return;}
 const nums=[...selected];
 const winner=nums[Math.floor(Math.random()*nums.length)];
 document.getElementById("result").textContent="🎉 የወጣው ቁጥር "+winner;
 document.getElementById("message").textContent=name+" ይህ የሙከራ ዕጣ ነው።";
}
